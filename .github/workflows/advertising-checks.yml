name: Advertising integration checks
on:
  pull_request:
    paths:
      - '*.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/advertising-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check app.js
      - run: node --check advertising.js
      - run: node --check forus-ads.js
      - run: node --test tests/advertising.test.cjs

